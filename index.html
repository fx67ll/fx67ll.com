<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fx67ll的个人主页</title>
  <meta name="description" content="fx67ll的个人主页">
  <meta name="keywords" content="fx67ll, fx67ll.com, fx67ll的个人主页">
  <meta name="author" content="dankefx67llpr@gmail.com">
  <!-- <link rel="icon" type="image/jpeg"  href="lib/img/favicon.ico"> -->
  <link rel="icon" type="image/jpeg" href="https://test.fx67ll.com/fx67ll-img-collection/fx67ll.jpg">
  <link href="lib/css/vendors.css" rel="stylesheet" />
  <link href="lib/css/energy.css" rel="stylesheet" />
</head>

<body>
  <div
    class="overlay"
    role="button"
    tabindex="0"
    aria-label="Open fx67ll resume"
    title="Open fx67ll resume"
  ></div>

  <footer class="fx67ll-footer">
    <span>Designed &amp; Powered by</span>
    <a href="https://nav.fx67ll.com" target="_blank" rel="noopener noreferrer">fx67ll</a>
    <span>&#12288; Copyright&copy; 2018- </span><span id="nowYear"></span><span> &#12288;</span>
    <a
      href="https://beian.miit.gov.cn/#/Integrated/index"
      target="_blank"
      rel="noopener noreferrer"
    >皖ICP备18017174号</a>
  </footer>
  <script type="text/javascript" src="lib/js/vendors.js"></script>
  <script type="text/javascript" src="lib/js/energy.js"></script>
  <script>
    (() => {
      const resumeUrl = "https://resume.fx67ll.com";
      const overlay = document.querySelector(".overlay");
      const openResume = () => window.open(resumeUrl, "_blank");

      overlay.addEventListener("click", openResume);
      overlay.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openResume();
        }
      });
      document.querySelector("#nowYear").textContent = new Date().getFullYear();
    })();
  </script>
</body>

</html>
